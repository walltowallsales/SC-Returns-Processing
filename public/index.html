<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><title>SellerChamp Returns</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="pinGate" class="gate hidden"><form id="pinForm" class="card narrow"><h1>Returns</h1><p>Enter PIN</p><input id="pin" inputmode="numeric" type="password" autocomplete="off"><button>Unlock</button><p id="pinError" class="error"></p></form></div>
<header><h1>SellerChamp Returns</h1><nav><button class="tab active" data-tab="intake">1. Return Intake</button><button class="tab" data-tab="back">2. Process Returns</button><button class="tab" data-tab="archived">3. Archived</button></nav></header>
<main>
<section id="intake" class="panel active"><div class="card"><h2>Find Order</h2><label>eBay Order ID</label><div class="row"><input id="orderInput" inputmode="numeric" pattern="[0-9-]*" placeholder="12-34567-89012" maxlength="14"><button id="findOrder">Find Order</button></div><p class="hint">Type numbers only if you prefer; hyphens are added automatically.</p><p id="orderError" class="error"></p></div><div id="orderResults"></div></section>
<section id="back" class="panel"><div class="card"><div class="row spread"><div><h2>Returns Queue</h2><p class="hint">Sorted by item location.</p></div><button id="refreshQueue" class="secondary">Refresh</button></div><div id="queue"></div></div><div id="detail"></div></section>
<section id="archived" class="panel"><div class="card"><div class="row spread"><div><h2>Archived Returns</h2><p class="hint">Completed returns are kept here for review.</p></div><button id="refreshArchive" class="secondary">Refresh</button></div><input id="archiveSearch" placeholder="Search order, SKU, title, location, or notes"><div id="archiveQueue"></div></div><div id="archiveDetail"></div></section>
</main><script src="/app.js"></script></body></html>
